# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["feature/octo-kit-testing"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Commit SHA from Tag
        id: get_commit_sha
        uses: octokit/request-action@v2.x
        with:
          route: GET /repos/${{ github.repository_owner }}/${{ github.event.repository.name }}/git/ref/tags/v1.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Commit SHA
        id: extract_commit_sha
        run: |
          COMMIT_SHA=$(echo '${{ steps.get_commit_sha.outputs.data }}' | jq -r '.object.sha')
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

      - name: Get Commit Details
        id: get_commit_details
        uses: octokit/request-action@v2.x
        with:
          route: GET /repos/${{ github.repository_owner }}/${{ github.event.repository.name }}/git/commits/${{ steps.extract_commit_sha.outputs.commit_sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Parent Commit SHA
        id: extract_parent_commit_sha
        run: |
          PARENT_SHA=$(echo '${{ steps.get_commit_details.outputs.data }}' | jq -r '.parents[0].sha')
          echo "parent_commit_sha=$PARENT_SHA" >> $GITHUB_OUTPUT

      - name: Get Parent Commit Details
        id: get_parent_commit_details
        uses: octokit/request-action@v2.x
        with:
          route: GET /repos/${{ github.repository_owner }}/${{ github.event.repository.name }}/commits/${{ steps.extract_parent_commit_sha.outputs.parent_commit_sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Workflow Runs
        id: get_workflow_runs
        uses: octokit/request-action@v2.x
        with:
          route: GET /repos/${{ github.repository_owner }}/${{ github.event.repository_name }}/actions/runs?per_page=100
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find Workflow Run for Parent Commit
        id: find_workflow_run
        run: |
          WORKFLOW_RUN=$(echo '${{ steps.get_workflow_runs.outputs.data }}' | jq -c '.workflow_runs[] | select(.head_sha=="${{ steps.extract_parent_commit_sha.outputs.parent_commit_sha }}")' | head -n 1)
          if [ -z "$WORKFLOW_RUN" ]; then
            echo "run_number=N/A" >> $GITHUB_OUTPUT
            echo "conclusion=N/A" >> $GITHUB_OUTPUT
            echo "workflow_name=N/A" >> $GITHUB_OUTPUT
            echo "updated_at=N/A" >> $GITHUB_OUTPUT
          else
            RUN_NUMBER=$(echo "$WORKFLOW_RUN" | jq -r '.run_number')
            CONCLUSION=$(echo "$WORKFLOW_RUN" | jq -r '.conclusion')
            WORKFLOW_NAME=$(echo "$WORKFLOW_RUN" | jq -r '.name')
            UPDATED_AT=$(echo "$WORKFLOW_RUN" | jq -r '.updated_at')
            echo "run_number=$RUN_NUMBER" >> $GITHUB_OUTPUT
            echo "conclusion=$CONCLUSION" >> $GITHUB_OUTPUT
            echo "workflow_name=$WORKFLOW_NAME" >> $GITHUB_OUTPUT
            echo "updated_at=$UPDATED_AT" >> $GITHUB_OUTPUT
          fi

      - name: Generate Deployment Status HTML
        run: |
          # File paths
          INDEX_FILE="index.html"  # Adjust the path if your index.html is in a different directory

          # Extract details
          TAG="v1.3.1"
          ENVIRONMENT="${{ steps.find_workflow_run.outputs.workflow_name }}"
          RUN_NUMBER="${{ steps.find_workflow_run.outputs.run_number }}"
          RUN_CONCLUSION="${{ steps.find_workflow_run.outputs.conclusion }}"
          COMMIT_SHA="${{ steps.extract_parent_commit_sha.outputs.parent_commit_sha }}"
          COMMIT_MESSAGE=$(echo '${{ steps.get_parent_commit_details.outputs.data }}' | jq -r '.commit.message')
          COMMIT_AUTHOR=$(echo '${{ steps.get_parent_commit_details.outputs.data }}' | jq -r '.commit.author.name')
          COMMIT_DATE=$(echo '${{ steps.get_parent_commit_details.outputs.data }}' | jq -r '.commit.author.date')
          DEPLOY_TIME="${{ steps.find_workflow_run.outputs.updated_at }}"

          # Debug: Print variable values
          echo "=== DEBUG: Variable Values ==="
          echo "TAG: $TAG"
          echo "ENVIRONMENT: $ENVIRONMENT"
          echo "RUN_NUMBER: $RUN_NUMBER"
          echo "RUN_CONCLUSION: $RUN_CONCLUSION"
          echo "COMMIT_SHA: $COMMIT_SHA"
          echo "COMMIT_MESSAGE:"
          echo "$COMMIT_MESSAGE"
          echo "COMMIT_AUTHOR: $COMMIT_AUTHOR"
          echo "COMMIT_DATE: $COMMIT_DATE"
          echo "DEPLOY_TIME: $DEPLOY_TIME"
          echo "=============================="

          # Use perl to replace placeholders in index.html
          perl -i -0777 -pe "s/\{\{\s*TAG\s*\}\}/\$ENV{TAG}/g" "$INDEX_FILE"
          perl -i -0777 -pe "s/\{\{\s*ENVIRONMENT\s*\}\}/\$ENV{ENVIRONMENT}/g" "$INDEX_FILE"
          perl -i -0777 -pe "s/\{\{\s*RUN_NUMBER\s*\}\}/\$ENV{RUN_NUMBER}/g" "$INDEX_FILE"
          perl -i -0777 -pe "s/\{\{\s*RUN_CONCLUSION\s*\}\}/\$ENV{RUN_CONCLUSION}/g" "$INDEX_FILE"
          perl -i -0777 -pe "s/\{\{\s*COMMIT_SHA\s*\}\}/\$ENV{COMMIT_SHA}/g" "$INDEX_FILE"
          perl -i -0777 -pe "s/\{\{\s*COMMIT_MESSAGE\s*\}\}/\$ENV{COMMIT_MESSAGE}/g" "$INDEX_FILE"
          perl -i -0777 -pe "s/\{\{\s*COMMIT_AUTHOR\s*\}\}/\$ENV{COMMIT_AUTHOR}/g" "$INDEX_FILE"
          perl -i -0777 -pe "s/\{\{\s*COMMIT_DATE\s*\}\}/\$ENV{COMMIT_DATE}/g" "$INDEX_FILE"
          perl -i -0777 -pe "s/\{\{\s*DEPLOY_TIME\s*\}\}/\$ENV{DEPLOY_TIME}/g" "$INDEX_FILE"
        env:
          TAG: "v1.3.1"
          ENVIRONMENT: ${{ steps.find_workflow_run.outputs.workflow_name }}
          RUN_NUMBER: ${{ steps.find_workflow_run.outputs.run_number }}
          RUN_CONCLUSION: ${{ steps.find_workflow_run.outputs.conclusion }}
          COMMIT_SHA: ${{ steps.extract_parent_commit_sha.outputs.parent_commit_sha }}
          COMMIT_MESSAGE: ${{ steps.get_parent_commit_details.outputs.data | fromJson | get('commit').get('message') }}
          COMMIT_AUTHOR: ${{ steps.get_parent_commit_details.outputs.data | fromJson | get('commit').get('author').get('name') }}
          COMMIT_DATE: ${{ steps.get_parent_commit_details.outputs.data | fromJson | get('commit').get('author').get('date') }}
          DEPLOY_TIME: ${{ steps.find_workflow_run.outputs.updated_at }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
